services:
  - type: web
    name: amazon-price-error-monitor
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_ui:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: apem-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # --- already set by you (secrets) ---
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATA_DIR
        value: /var/data
      - key: KEEPA_API_KEY
        sync: false
      - key: UI_PASSWORD
        sync: false
      - key: DISCORD_WEBHOOK_50
        sync: false
      - key: DISCORD_WEBHOOK_60
        sync: false
      - key: DISCORD_WEBHOOK_70
        sync: false
      - key: DISCORD_WEBHOOK_80
        sync: false
      - key: CHANNEL_ENABLED_50
        value: "true"
      - key: CHANNEL_ENABLED_60
        value: "true"
      - key: CHANNEL_ENABLED_70
        value: "true"
      - key: CHANNEL_ENABLED_80
        value: "true"
      # --- remaining settings (env = source of truth) ---
      - key: KEEPA_DOMAIN
        value: "1"
      - key: PRICE_TYPE
        value: "1"
      - key: DATE_RANGE
        value: "2"
      - key: ROUTE_MODE
        value: highest
      - key: POLL_INTERVAL_SEC
        value: "1500"
      - key: MIN_DISCOUNT
        value: "50"
      - key: ALERT_COOLDOWN_HOURS
        value: "24"
      - key: REFERENCE_MODE
        value: keepa_avg
      - key: MAX_ALERTS_PER_TIER
        value: "4"
      - key: ENRICH_ON_ALERT
        value: "true"
      - key: NO_REPEAT_SAME_DAY
        value: "true"
      - key: ALLOW_CHEAPER_REPEAT
        value: "true"
      - key: MIN_ORIGINAL_PRICE
        value: "4"
      - key: MIN_REVIEW_COUNT
        value: "0"
      - key: MIN_RATING
        value: "0"
      - key: SELLER_TYPE
        value: any
      - key: ENRICH_PRODUCTS
        value: "false"
      - key: REQUIRE_LOWEST
        value: "false"
      - key: MIN_RECENT_DISCOUNT
        value: "10"
      - key: REJECT_PROMOTIONS
        value: "false"
      - key: REJECT_BUSINESS
        value: "false"
      - key: VERIFY_LIVE_PRICE
        value: "true"
      - key: INCLUDE_GRAPH
        value: "true"
      - key: LOG_LEVEL
        value: INFO
